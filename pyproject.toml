[project]
name = "rea-mcp"
version = "1.0.0"
description = "MCP server for REA (Reverse Engineer Anything) agent coordination"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
keywords = ["rea", "mcp", "agent", "coordination", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
]

[project.scripts]
rea-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
compile-bytecode = true
cache-keys = [{ file = "pyproject.toml" }, { file = "requirements.txt" }, { file = "src/**/*.py" }]
required-version = ">=0.5.0"

[tool.uv.sources]
# All dependencies sourced from PyPI (default)

[tool.uv.pip]
require-hashes = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]
