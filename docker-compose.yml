version: "3.9"

services:
  # ── REA MCP Server using npx oficial ──────────────────────────────────
  # Este servicio usa el comando oficial: npx -y rea-agents@6.4.0 mcp
  # Para conexión directa via stdio:
  #   docker run -i --rm rea-mcp
  # Para conexión via docker exec:
  #   docker exec -i rea-mcp python -m src.server (fallback)
  rea-mcp-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: rea-mcp:latest
    container_name: rea-mcp
    stdin_open: true
    tty: true
    init: true
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL', 'printf \'{"jsonrpc":"2.0","id":1,"method":"initialize"}\\n'\'' | npx -y rea-agents@6.4.0 mcp 2>/dev/null | grep -q jsonrpc']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
